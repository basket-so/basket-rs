[toolchain]
anchor_version = "0.31.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
omnindex = "H6JKCZU82gCADQZ98Jmfj7UzpHTdbyfnDpt7AD5NZ3Lt"

[programs.mainnet]
omnindex = "H6JKCZU82gCADQZ98Jmfj7UzpHTdbyfnDpt7AD5NZ3Lt"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "deployer-keypair.json"

[workspace]
members = ["programs/omnindex"]

[scripts]
build-mainnet = "anchor build"
deploy-mainnet = "anchor deploy --provider.cluster mainnet"
test = "cargo test -p omnindex"
