[toolchain]
anchor_version = "0.31.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
basket = "5PYVGshoLQrcawa8zyUCe4qTCe1AQJt6Nxkk89yVgkxu"

[programs.mainnet]
basket = "5PYVGshoLQrcawa8zyUCe4qTCe1AQJt6Nxkk89yVgkxu"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "deployer-keypair.json"

[workspace]
members = ["programs/basket"]

[scripts]
build-mainnet = "anchor build"
deploy-mainnet = "anchor deploy --provider.cluster mainnet"
test = "cargo test -p basket"
